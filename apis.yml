aid: 24fix
name: 24 FIX
description: >-
  24 FIX is the flagship consumer home-maintenance brand of 24 Solution Group (Thailand) Co., Ltd.,
  founded in Bangkok in 2018 by six co-founders and now operating under the 24X umbrella brand. It
  runs an end-to-end property maintenance and home-solutions service rather than a matchmaking
  marketplace: air-conditioner cleaning and repair, washing-machine and appliance service, electrical
  and plumbing work, painting, cleaning, renovation and construction, delivered through an in-house
  managed ecosystem of more than 500 fixer teams and material vendor stores across Bangkok and the
  surrounding provinces, with expansion into Phuket and Singapore. The group fields four business
  lines — 24 FIX (consumer), 24 FIX for Business (commercial and facility maintenance, 500+ corporate
  customers), 24 House Solution, and 24 Projects (renovation and construction) — supported by an
  internal computerized maintenance management system that dispatches, tracks and quality-controls
  technician jobs. It raised a seed round in 2020, a pre-Series A from ECG Venture Capital in 2021, a
  150 million THB Series A from Krungsri Finnovate, ECG Venture Capital and BCH Ventures in 2022, and
  a USD 5 million Series B from Wavemaker and Krungsri Finnovate in 2023. 24 FIX is a consumer and
  B2B services operator, not a software vendor: it publishes no developer portal, no API
  documentation, no SDKs and no machine-readable API contract, and the only /api/ path on its booking
  application is an internal Next.js route tree its own robots.txt disallows.
